<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>場所から出会う小説案内</title>
    <meta
      name="description"
      content="この街を、物語で歩く。場所から次に読む一冊に出会える文学案内アプリ。"
    />
    <script>
      (function () {
        const redirect = sessionStorage.redirect;
        if (redirect) {
          delete sessionStorage.redirect;
          const next = redirect.replace(location.origin, "");
          history.replaceState(null, "", next);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
