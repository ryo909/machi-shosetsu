<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>まちで見つける小説</title>
    <meta name="application-name" content="まちで見つける小説" />
    <meta
      name="description"
      content="まちで見つける小説は、この街を、物語で歩くための文学案内アプリ。場所から次に読む一冊に出会えます。"
    />
    <meta property="og:title" content="まちで見つける小説" />
    <meta
      property="og:description"
      content="この街を、物語で歩く。場所から次に読む一冊に出会える文学案内アプリ。"
    />

    <meta name="apple-mobile-web-app-title" content="まちで見つける小説" />
    <script>
      (function () {
        const redirect = sessionStorage.redirect;
        if (redirect) {
          delete sessionStorage.redirect;
          const next = redirect.replace(location.origin, "");
          history.replaceState(null, "", next);
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
